# =============================================================================
#  autonomy.yaml — görev yöneticisinin TEK yapılandırması (D-29: kodda varsayılan yok)
# -----------------------------------------------------------------------------
#  Robot ölçüleri forklift_params.yaml'dan (robot_params_file), taşıyıcı önü x ve çatal
#  sınırları oradan türetilir; burada yazılmaz. Birimler: m, s, rad (açılar _deg ise derece).
# =============================================================================
topics:
  cmd_vel: /cmd_vel/auto          # twist_mux önceliği 50 (teleop 100 önde)
  fork: /fork/cmd_height
  e_stop: /e_stop
  teleop: /cmd_vel/teleop
  odom: /odom
  joint_states: /joint_states
  bay_targets: /perception/bay_targets
  parcels: /perception/parcels
  load: /perception/load
  signs: /perception/signs
  lanes: /perception/lanes
  state: /autonomy/state
frames: {odom: odom, base: base_footprint}
fork_joint: fork_lift_joint
rate_hz: 20.0                     # komut yayını (gate girdi zaman aşımı 0.2 s; twist_mux 0.5 s)
state_rate_hz: 5.0
e_stop_stale_s: 0.6               # /e_stop bu süre gelmezse basılı sayılır (GUI 10 Hz yayınlar)
teleop_override_s: 0.3
max_meas_yaw_rate: 0.15           # bundan hızlı dönerken ölçüm (bölme, tabela, şerit) izlemeye alınmaz [rad/s]
self_parcel_margin: 0.10          # çatal ucu + bu mesafeden yakın koli bizim taşıdığımızdır (ön kamera görür) [m]
accel_limits: {v: 0.5, w: 1.5}    # komut değişim sınırı [m/s², rad/s²]; yüklü dönüşte koli kaymasın (plan §10.1)
transit_method: sign              # sign (K4, station_test) | lane (factory); launch argümanı ezer

mission:
  finish_when_source_seen_empty: true   # son alımda kaynakta koli kalmadığı görüldüyse son bırakmadan sonra DONE
  default_task: full              # /autonomy/start'ın görevi; testler 'task' parametresiyle değiştirir
  observe_s: 1.5                  # OBSERVE: en az bu kadar dur ve izle
  observe_max_s: 6.0              # gözlem bu sürede tamamlanmazsa görülen bölmelerle seç
  select_wait_s: 3.0              # SELECT_BAY: dolu bölme için en çok bekleme
  align_distance: 0.75            # ön-giriş noktası: taban → ön çizgi [m] (yüklüyken kamera ≥ 0.575, D-62)
  align_lat_tol: 0.02             # SETTLE: girişe geçmek için yanal [m] (servo kalanı düzeltir)
  align_yaw_tol_deg: 1.5
  align_retries: 2
  reobserve_max: 2                # bölmesi görülmeyen koli için en çok yeniden konumlanma
  orphan_left_min: 0.15           # sahipsiz koli seçilen bölmenin en az bu kadar solundaysa (adım 0.30) [m]
  reobserve_wide: 1.10            # karar yoksa istasyon ortasının bu kadar önünden yeniden gözlem [m]
  reobserve_back: 0.15            # … kolinin önünde align_distance + bu kadar [m]
  settle_s: 0.8
  entry_gap: 0.015                # tam girişte taşıyıcı önü ön çizginin bu kadar gerisinde [m] (D-43, plan §7.1)
  trim_distance: 0.45             # son hizalama: taban → ön çizgi; çatal ucu (0.38) çizgiye 7 cm kala [m]
  trim_yaw_tol_deg: 0.15          # son hizalamada yön toleransı
  blind_distance: 0.25            # bundan yakında hedef görünmeyebilir (odometriyle sürülür) [m]
  lost_hold_s: 0.5                # bölme bu süre görülmezse dur ve bekle
  lost_fail_s: 2.0                # … bu süre: kurtarma (hedef kayıp, plan §7.2)
  recover_max: 2                  # bacak başına kurtarma denemesi; sonra FAULT
  recover_wait_s: 1.0             # kurtarma: dur ve bekle
  recover_back: 0.10              # kurtarma: geri [m]
  pick_retries: 1                 # alma başarısız: yeniden deneme
  load_loss_ratio: 0.8            # taşırken son verify_window yük ölçümünün bu kadarı "yok" ise yük kaybı
  abort_fork_wait_s: 4.0          # çatal takıldı: taşıma yüksekliği için en çok bekleme
  pick_q: 0.0                     # alma girişinde çatal (üstü 0.025 < koli tabanı 0.05)
  carry_q: 0.06                   # taşıma yüksekliği (D-43)
  fork_tol: 0.003
  back_out: 0.5
  v_transit: 0.15
  v_dock: 0.08                    # bölmeye girişte en büyük hız
  v_back: 0.12
  verify_window: 10               # VERIFY: son bu kadar yük ölçümü
  verify_ratio: 0.6
  timeouts: {FIND_STATION: 120.0, TRANSIT: 120.0, LANE_JOIN: 40.0, LANE_FOLLOW: 60.0, PRE_DOCK: 40.0,
             OBSERVE: 10.0, SELECT_BAY: 8.0, ALIGN: 40.0, SETTLE: 5.0, ENTER: 40.0, TRIM: 10.0, REPOSITION: 30.0, LIFT: 8.0,
             LOWER: 8.0, BACK_OUT: 15.0, VERIFY: 5.0, RECOVER: 15.0, ABORT: 20.0}
  transit:                         # istasyon arama ve transit (F4)
    v_travel: 0.25                # transit ayakları ve şerit takibi [m/s] (A3: yüklü 0.15'te kayma ≤ 0.7 mm)
    hint_tol_deg: 10.0            # hafızadaki tabela bu açıdan uzaksa önce ona dön
    look_s: 0.6                   # dur-bak: bakış süresi
    look_skip_s: 0.2              # bakışın ilk bu kadarı sayılmaz (duruş, TF)
    search_step_deg: 20           # arama adımı (ön kamera 60°; nötr tabela poza göre açık-kapalı algılanıyor, sık bak)
    search_steps: 19              # tam tur + 1
    search_turns: 1               # boş geçen turdan sonra yarım adım kaydırılmış ek tur sayısı
    near_range: 1.5               # tabela pozu bu mesafede yeterli (C1: ≤ 1.5 m 10 cm / 10°, D-70)
    approach_range: 1.3           # uzak ayaklar tabelaya bu mesafeye kadar
    max_leg: 1.0                  # tek ayakta en çok (odometri yalnız kısa manevrada, K3)
    max_legs: 6
    max_misses: 2                 # transitte üst üste boş bakış: saklı kestirimle devam, sonra yeniden ara
    max_axis_dev_deg: 60          # tabela ekseni bakış doğrultusundan bundan çok sapıyorsa güvenilmez (hedeften kaynağa ~45° eğik)
    predock_distance: 0.8         # ön-yanaşma: taban → istasyon ön kenarı (plan §7.1)
    predock_wait_s: 4.0           # PRE_DOCK: hedef çifti bu sürede görülmezse tabela pozuyla yetin
    predock_lat_tol: 0.03         # PRE_DOCK: bu toleranslardaysa düzeltme yok
    predock_dist_tol: 0.05
    predock_yaw_tol_deg: 2.0
    predock_moves: 1              # PRE_DOCK: en çok bu kadar düzeltme; sonuncusundan sonra yeniden ölçülmez
    lane_color: {neutral: yellow} # istasyon rengi → şerit rengi (station_params: colors.lane_neutral)
    wrong_station_range: 1.6      # PRE_DOCK: bu mesafedeki en yakın tabela beklenen renk olmalı [m]
    exclude_radius: 0.5           # yanlış çıkan istasyonun tabelası bu yarıçapta dışlanır [m]
    lane_sign_max_offset: 0.5     # şerit doğrusu hedef tabelaya bundan uzak geçiyorsa şerit kullanılmaz [m]
    lane_retries: 2               # şerit görülmezse tabela ayağından sonra yeniden giriş denemesi
    lane_look_s: 1.0              # LANE_JOIN: şerit noktası toplama
    join_ahead: 0.3               # şeride robotun izdüşümünün bu kadar önünden girilir
    lane_lost_s: 1.5
    lane_recent_s: 0.5            # takipte doğru yalnız bu kadar taze noktalardan (yoksa bellekten)
    lane_stop_offset: 0.40        # durma çizgisinin bu kadar önünde dur (hat kuralı; çizgi önlükten 0.4 m önde)
    lane_free_ahead: 0.6          # durma çizgisi görülene kadar servo hedefi bu kadar ileride
    lane_servo: {k_dist: 0.8, v_final: 0.03, k_head: 1.5, k_stanley: 2.0, v_soft: 0.1, w_servo_max: 0.4}
  motion:                          # hareket ilkelleri (odometri)
    k_turn: 2.0
    w_max: 0.6
    w_min: 0.05
    turn_tol: 0.004               # [rad] (0.23°)
    k_dist: 1.5
    v_min: 0.02
    dist_tol: 0.004
    k_head: 2.0
    k_lat: 3.0
    goto_tol: 0.01
  servo:                           # bölme ekseni servosu (Stanley)
    k_dist: 0.8
    v_final: 0.03                 # son kısımda en küçük hız [m/s] (DiffDrive 1 m/s² frenle ~0.5 mm)
    k_head: 1.5
    k_stanley: 2.5
    v_soft: 0.05
    w_servo_max: 0.3

tracker:
  assoc_dist: 0.10                # yeni ölçüm bu kadar yakın bölmeyle eşleşir [m] (bölme adımı 0.30)
  alpha_pair: 0.3                 # hedef çifti üstel ortalama ağırlığı
  alpha_label: 0.3                # bölme etiketi (yalnız konum)
  pair_recent_s: 0.3              # çift bu süre içinde görüldüyse etiket yanal konumu değiştirmez
  min_pair_obs: 3                 # bölme bu kadar çift ölçümüyle doğrulanır
  stable_s: 1.0                   # gözlem tamam: bu süredir yeni bölme açılmadı, yakındaki her iz doğrulandı
  min_empty_votes: 10             # bölme görüş alanındayken bu kadar karede koli yoksa boş
  parcel_view_margin_deg: 5.0     # "boş" oyu: bölme ön kamera yarım açısının bu kadar içinde
  parcel_view_range: [0.5, 3.0]   # … ve kameradan bu uzaklıkta [m]
  parcel_lateral: 0.08            # koli bölme ekseninde [m]
  parcel_along: 0.15              # koli ön yüzü ön çizgiye eksen boyunca [m]
  parcel_memory_s: 3.0
  sign_window_s: 1.5              # tabela: son bu kadar ölçüm
  sign_min_obs: 3
  sign_max_range: 3.6             # algı menzili (C1: 0.6–3.5 m); ötesi yanlış pozitif sayılır [m]
  sign_gate: 0.4                  # kestirime bundan uzak tabela ölçümü atılır [m]
  lane_window_s: 30.0             # şerit: bu kadar saniyedir görülen noktalar (bacak boyunca; odometri kısa yolda sağlam)
  lane_gate: 0.08                 # şerit adayı izlenen doğruya bundan uzaksa başka şerit (bölme şeridi 0.30 m yanda) [m]
  lane_fit_range: 1.6             # doğruya yalnız robota bu kadar yakın görülen noktalar [m]
  lane_cell: 0.02                 # nokta tekilleştirme ızgarası [m]
  lane_min_pts: 10
  lane_min_len: 0.3               # doğru uydurmak için en kısa görünen şerit [m]
  bar_gate: 0.3                   # durma çizgisi: bundan uzak yeni ölçüm izi yeniden başlatır
  alpha_bar: 0.3
