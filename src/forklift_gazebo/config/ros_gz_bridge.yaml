# ROS 2 <-> Gazebo Sim köprüsü (ros_gz_bridge parameter_bridge, config_file).
# Görüntüler (image_raw) burada DEĞİL: ros_gz_image image_bridge ile
# köprülenir (image_transport sıkıştırma eklentileri için; DECISIONS D-12).
# Gazebo tarafı topic adları ROS adlarıyla aynıdır ve
# forklift_params.yaml (gazebo.interface, cameras.*) ile eşleşmelidir.

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /cmd_vel
  gz_topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /odom
  gz_topic_name: /odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

# DiffDrive TF'i: odom -> base_footprint
- ros_topic_name: /tf
  gz_topic_name: /tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name: /joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# Çatal yüksekliği [m]
- ros_topic_name: /fork/cmd_height
  gz_topic_name: /fork/cmd_height
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /front_camera/camera_info
  gz_topic_name: /front_camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

- ros_topic_name: /lane_camera/camera_info
  gz_topic_name: /lane_camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

# IMU (D-67): ivme ve açısal hız; gövde eğimi algılamada (yönelim alanı kullanılmaz)
- ros_topic_name: /imu
  gz_topic_name: /imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
