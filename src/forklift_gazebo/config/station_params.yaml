# =============================================================================
#  station_params.yaml — yük istasyonu, hizalama hedefleri ve koli (parcel)
#  modellerinin TEK doğruluk kaynağı
# -----------------------------------------------------------------------------
#  station.sdf.xacro, parcel.sdf.xacro, generate_station_textures.py,
#  stations.launch.py ve station_acceptance.py bu dosyayı okur. Xacro içinde
#  yalnızca formül katsayıları (1/2, 1/12) bulunur.
#
#  Birimler: m, kg, rad. Çerçeveler (DECISIONS D-43):
#    station : orijin zeminde, istasyon ön kenarının ortasında; +x istasyonun
#              içine (çatalın girdiği yön), +y sol, +z yukarı.
#    bay_i   : orijin zeminde, bölme i'nin kanal ekseninde, ön kenarda;
#              eksenler station ile aynı. y_i = (i - (N-1)/2) · bay_pitch,
#              bölme 0 en -y tarafta (istasyona bakarken sağda).
#  Türetilen değerler (xacro hesaplar, burada TEKRAR YAZILMAZ):
#    * istasyon genişliği W = N · bay_pitch
#    * kanal i: y ∈ [y_i ± channel_width/2], x ∈ [0, ledge_depth]
#    * çıkıntılar: kanallar arası; uçtakiler (bay_pitch - channel_width)/2,
#      aradakiler bay_pitch - channel_width genişliğinde
#    * arka plaka: x ∈ [ledge_depth, ledge_depth + back_plate_thickness]
#    * zemin plakası: x ∈ [-apron_depth, ledge_depth + back_plate_thickness]
#    * hizalama hedefi merkezi: y_i ± (channel_width/2 + edge_gap + size/2),
#      z = ledge_height/2, çıkıntı ön yüzünde (D-55)
#    * bölme şeridi: bölme ekseninde, x ∈ [-apron_depth + band_width, 0] (D-56)
#    * koli bölmedeki nominal merkezi: x = parcel_front_gap + parcel.size.x/2,
#      z = ledge_height + parcel.size.z/2
# =============================================================================

# ------------------------------------------------------------- istasyon -----
station:
  bay_pitch: 0.30              # bölme adımı
  channel_width: 0.17          # çatal kanalı (çatal dış açıklığı 0.12 → ±2.5 cm)
  ledge_height: 0.05           # çıkıntı üst yüzü z
  ledge_depth: 0.30            # çıkıntı ve kanal uzunluğu, x ∈ [0, 0.30]
  ledge_mu: 0.8                # çıkıntı sürtünmesi (DART min(μA, μB), D-15)
  back_plate_thickness: 0.02
  back_plate_height: 0.30      # tüm istasyon genişliği boyunca
  base_plate_thickness: 0.002  # istasyon renginde zemin plakası; collision'lı [D-46]
  apron_depth: 0.30            # plakanın ön kenardan dışarı taşması
  parcel_front_gap: 0.01       # nominal koli önü x (bay çerçevesi)

# ------------------------------------------- işaretler (hizalama, D-55/56) ---
# ArUco işaretleri kaldırıldı (D-56): istasyon kimliği tabeladan (renk), bölme
# sırası hizalama hedefi çiftlerinden, yanaşma bölme şeridinden gelir.
markers:
  max_bay_id: 24               # bölme numarası k ∈ [0, 24] (bölme etiketleri bay_kk.png)
  standoff: 0.0005             # çıkıntı ön yüzü ile hedef kutusu arası (z-fighting)
  thickness: 0.001             # hedef kutusu kalınlığı (x); collision yok
  align:                       # [D-55] kanal kenarı hizalama hedefleri: bölme başına 2, çıkıntıların
                               # ön yüzünde kanalın iki yanında; dikeyde ön yüzün ortası (ledge_height / 2)
    pattern: bullseye          # [D-55] bullseye (halka + dolu daire; nokta = koyuluk ağırlık merkezi) | checker (2×2 dama)
    size: 0.036                # beyaz plaka kenarı (kare)
    checker: 0.024             # checker: ortadaki 2×2 dama deseninin kenarı (hücre = checker / 2)
    bullseye: {ring_outer: 0.028, ring_inner: 0.020, dot: 0.012}   # çaplar; kenar, halka ve boşluk 4 mm
    edge_gap: 0.005            # plakanın kanal tarafındaki kenarı ile kanal kenarı arası
    texture_px: 480            # doku kenarı [px]

# ----------------------------------------------------------------- koli -----
parcel:
  size: {x: 0.20, y: 0.24, z: 0.20}
  mass: 0.5                    # atalet geometriden (dolu kutu) hesaplanır
  mu: 0.8
  seal:                        # -x yüzünde ortalanmış, ayrı visual, collision yok
    size: {y: 0.10, z: 0.10}
    thickness: 0.002

# ------------------------------------------------------- görsel (tek yer) ---
# rgba diffuse; ambient = ambient_scale · diffuse. Mat: düşük specular,
# PBR roughness 1, metalness 0.
material:
  ambient_scale: 0.8
  specular: [0.05, 0.05, 0.05, 1.0]
  roughness: 1.0
  metalness: 0.0
colors:
  red:     [0.85, 0.05, 0.05, 1.0]   # test_parcel mühür rengiyle aynı
  green:   [0.05, 0.65, 0.10, 1.0]
  blue:    [0.05, 0.20, 0.85, 1.0]
  neutral: [0.80, 0.80, 0.80, 1.0]   # kaynak istasyon zemin plakası (açık gri)
  ledge:   [0.25, 0.25, 0.27, 1.0]   # koyu gri
  back_plate: [0.95, 0.95, 0.95, 1.0]  # beyaz (işaret kontrastı)
  parcel_body: [0.55, 0.36, 0.18, 1.0]  # kahverengi, test_parcel ile aynı
  band_neutral: [0.92, 0.92, 0.90, 1.0]  # kaynak istasyon bandı (beyaz zemin boyası)
  lane_neutral: [0.95, 0.75, 0.05, 1.0]  # kaynak istasyonun bölme şeridi (sarı; zemin şeridiyle aynı)
  tape:    [0.50, 0.37, 0.22, 1.0]   # koli bandı (kahverengi PP bant; tavan ışığında açılır)

# ------------------------------------------------ görünüm (yalnız visual) ---
# Bu bölüm collision, ölçü ve sürtünmeyi etkilemez. Dokular:
#   model://factory_materials/materials/textures  CC0 fotoğraf dokuları (depoda,
#       kaynak: scripts/fetch_factory_textures.py, models/factory_materials/README.md)
#   model://factory_signs/materials/textures      tabela ve etiketler (build'de
#       scripts/generate_factory_textures.py üretir)
appearance:
  band_width: 0.04             # zemin plakası üstündeki renk bandı (çevre)
  band_height: 0.001           # bandın plaka üstünden yüksekliği (z-fighting payı)
  back_plate_recess: 0.001     # arka plaka visual'ı collision'ın bu kadar gerisinde;
                               # bölme etiketi araya girer
  label_thickness: 0.0005      # bölme etiketi kalınlığı
  frame:                       # arka plakanın arkasında alüminyum profil çerçeve
    profile: 0.04              # profil kesiti (kare)
    height: 0.62               # dikme üst z
  sign:                        # istasyon tabelası, çerçeveye asılı, robota bakar
    width: 0.60                # en fazla; dar istasyonda W - 2·profile
    aspect: 4.0                # genişlik / yükseklik (doku 1024 × 256)
    top_z: 0.57
    thickness: 0.003
  bay_line:                    # [D-56] bölme şeridi: zemin plakası üstünde bölme ekseni boyunca,
                               # önlük bandının iç kenarından kanal girişine (x = 0); rengi istasyonun
                               # rengi, kaynak istasyonda sarı (colors.lane_neutral)
    width: 0.04
  bay_label:                   # bölme numarası, arka plakada
    size: 0.045                # kare kenarı
    center_z: 0.258
  parcel:
    tape_width: 0.05           # üst yüzde x boyunca, +x yüzünden 0.05 aşağı iner
    tape_drop: 0.05
    label: {x: 0.10, z: 0.075} # +y yüzünde gönderi etiketi (genişlik x, yükseklik z)

# PBR yüzeyler. maps: <ad>_{albedo,normal,roughness}.jpg (factory_materials);
# rgba albedo ile çarpılır. Metalness düşük: ogre2'de ortam haritası olmadan
# metal yüzey kararıyor.
finishes:
  tread_plate: {maps: tread_plate, rgba: [0.95, 0.95, 0.95, 1.0], metalness: 0.25}
  aluminium:   {maps: aluminium, rgba: [1.0, 1.0, 1.0, 1.0], metalness: 0.1}
  rubber:      {maps: rubber, rgba: [0.55, 0.55, 0.55, 1.0], metalness: 0.0}
  cardboard:   {maps: cardboard, rgba: [0.86, 0.72, 0.56, 1.0], metalness: 0.0}  # kraft tonu
