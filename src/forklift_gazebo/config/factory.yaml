# =============================================================================
#  factory.yaml — fabrika dünyasının (worlds/factory.sdf) tek doğruluk kaynağı
# -----------------------------------------------------------------------------
#  scripts/generate_factory_world.py bu dosyayı, stations.yaml'ı ve
#  station_params.yaml'ı okuyup build sırasında factory.sdf ve
#  factory_lanes.yaml (şerit ground truth) üretir.
#
#  Dünya çerçevesi station_test ile aynıdır: robot orijinde, +x'e bakar;
#  istasyonlar stations.yaml'daki pozlarda (launch sırasında spawn edilir).
#  Hol (Depot) bu çerçeveye göre kaydırılır; hücre holün boş yarısında, iki
#  iç kolonun arasında kalır.
#
#  Birimler: m, rad. pose: [x, y, z, yaw] (z, yaw verilmezse 0).
#  Fuel modelleri ilk açılışta indirilir (~/.gz/fuel); sürüm sabittir.
#  Lisanslar ve yazarlar: src/forklift_gazebo/README.md → Third-party assets.
# =============================================================================

fuel: https://fuel.gazebosim.org/1.0/OpenRobotics/models

hall:
  model: Depot/6             # Open Robotics, CC-BY 4.0; tuğla hol, asma kat, baked lightmap
  # 180° döndürülmüş: kaynak istasyonun arkasında (ön kameranın koli/mühür
  # gördüğü yön) sade kepenk duvarı kalır; Depot'un raf/varil setleri mavi
  # hedefin arkasında, dünyada x ≤ -6.6. Depot iç kolonları (0.46 m kare) dünyada
  # (-0.56, -3.615) ve (-0.56, 3.885); mesh köşelerinden ölçüldü.
  pose: [-8.1, 0.0, 0.0, 3.14159265]
  # Depot'un 100 × 100 m'lik zemin collision'ı kaldırılır; zemin bizim
  # ground_plane'imizdir (μ = 1.0, D-15).
  remove_collisions: [main::collision]
  # Depot'un vantilatör ışıkları kaldırılır: zayıflama katsayılarının üçü de 0
  # (1/0) ve ogre2'de objeleri kameraya göre doyuruyor ya da karartıyor (D-53).
  remove_lights: [Fan1::fan_light, Fan2::fan_light]
  # clutter: full → Depot'un raf/varil/kasa setleri (BOXSET, crates) kalır;
  #          clean → kaldırılır (CV için sade arka plan).
  clutter: full
  clutter_visuals: [main::BOXSET_visual, main::crates]

# --------------------------------------------------------------- ışık -----
# Depot'un dokuları baked aydınlatma (lightmap) içerir; buradaki ışıklar
# hücreyi ve bizim modellerimizi aydınlatır. Şiddetler, ön kameranın kaynak
# istasyondaki mühür renkleri station_test ile ±%6 içinde kalacak şekilde
# ölçülerek seçildi (gz kamerasında otomatik pozlama yok; D-53).
scene:
  ambient: [0.45, 0.45, 0.46]
  background: [0.08, 0.08, 0.09]
lights:
  - name: skylight           # çatı fenerlerinden gelen dağınık gün ışığı
    type: directional
    direction: [-0.35, 0.2, -1.0]
    diffuse: [0.60, 0.60, 0.58]
    specular: 0.05
    shadows: true
  # tavan lambaları (high-bay, ~4000 K). Zayıflama 1 / (c + l·d + q·d²);
  # specular düşük: Depot zemininde dalgalı parlama oluşmasın.
  - {name: highbay_cell, type: spot, grid: {x: [-1.6, 1.4], y: [-1.6, 1.6]}, z: 7.0,
     diffuse: [0.90, 0.88, 0.81], specular: 0.03, attenuation: [1.0, 0.02, 0.002], range: 16.0,
     inner: 0.6, outer: 1.1, shadows_first: 1}
  - {name: highbay_hall, type: spot, grid: {x: [-5.5, 5.5], y: [-5.0, 5.0]}, z: 7.0,
     diffuse: [0.50, 0.49, 0.45], specular: 0.03, attenuation: [1.0, 0.02, 0.002], range: 14.0,
     inner: 0.7, outer: 1.2, shadows_first: 0}

# ------------------------------------------------------ zemin işaretleri ---
# Tümü collision'sız, zeminden 1 mm yüksek ince kutular (z-fighting payı).
markings:
  height: 0.001
  cell:                      # AMR hücre sınırı: sarı-siyah tehlike bandı
    bounds: [-3.4, 2.6, -3.25, 3.25] # x_min, x_max, y_min, y_max (kolon koruyucularına değmez)
    width: 0.075
    segment: 0.6             # doku 8:1; segment / width = 8 → şeritler bozulmaz
  lanes:                     # ileride şerit takibi için kılavuz bandı (ground truth üretilir)
    width: 0.05
    color: [0.95, 0.75, 0.05]
    # her şerit bir istasyonun önlük ön kenarında biter; uçlarda beyaz durma çizgisi
    from: [0.0, 0.0]
    to_stations: [source, dest_red, dest_green, dest_blue]
    end_gap: 0.10            # şerit sonu ile önlük ön kenarı arası
    stop_bar: {length: 0.30, width: 0.05, color: [0.93, 0.93, 0.92]}
  walkway:                   # yaya yolu: yeşil zemin, beyaz kenar, aralıklı yazı
    x: [-6.4, 5.8]
    y: [-5.6, -4.4]
    color: [0.10, 0.30, 0.15]
    edge: {width: 0.06, color: [0.93, 0.93, 0.92]}
    stencil: {every: 4.0, length: 1.0}   # floor_walkway.png (4:1), yürüme yönüne dik okunur

# ---------------------------------------------------------- aksesuarlar ---
# Hepsi statik ve hücrenin dışında. uri Fuel adıdır (sürüm sabit).
pillar_guards:               # kolon koruyucu: sarı-siyah sac (hazard_panel.png), 1.2 m
  centers: [[-0.56, -3.615], [-0.56, 3.885]]
  size: [0.56, 0.56, 1.2]
wall_signs:                  # kolonlara asılı levhalar (doku, merkez, yaw: levha normali)
  - {texture: sign_amr_zone.png, size: [0.80, 0.50], center: [-0.56, -3.86, 1.75], yaw: -1.5708}
  - {texture: sign_speed.png, size: [0.40, 0.40], center: [-0.56, -3.86, 1.27], yaw: -1.5708}
  - {texture: sign_amr_zone.png, size: [0.80, 0.50], center: [-0.56, 4.13, 1.75], yaw: 1.5708}
  - {texture: sign_amr_zone.png, size: [0.80, 0.50], center: [-0.31, 3.885, 1.75], yaw: 0.0}
props:
  # +y duvarı: koli rafları (2.61 m bölüm)
  - {uri: aws_robomaker_warehouse_ShelfD_01/4, pose: [-4.7, 5.6, 0.0, 1.5708]}
  - {uri: aws_robomaker_warehouse_ShelfE_01/4, pose: [-2.09, 5.6, 0.0, 1.5708]}
  - {uri: aws_robomaker_warehouse_ShelfD_01/4, pose: [0.52, 5.6, 0.0, 1.5708]}
  - {uri: aws_robomaker_warehouse_ShelfE_01/4, pose: [3.13, 5.6, 0.0, 1.5708]}
  # -y tarafı (yaya yolunun ötesi): paletli yükler ve ekipman
  - {uri: aws_robomaker_warehouse_ClutteringA_01/4, pose: [-4.2, -6.3, 0.0, 0.0]}
  - {uri: aws_robomaker_warehouse_ClutteringC_01/4, pose: [-1.6, -6.3, 0.0, 0.0]}
  - {uri: aws_robomaker_warehouse_PalletJackB_01/4, pose: [1.0, -6.2, 0.0, 0.3]}
  - {uri: aws_robomaker_warehouse_ClutteringA_01/4, pose: [3.4, -6.3, 0.0, 3.1416]}
  - {uri: aws_robomaker_warehouse_TrashCanC_01/4, pose: [5.3, -6.4, 0.0, 0.0]}
  # kepenk tarafı (+x): yükleme alanı; ön kameranın görüşünün (±30°) dışında
  - {uri: aws_robomaker_warehouse_ClutteringC_01/4, pose: [5.6, 5.0, 0.0, 1.5708]}
  - {uri: aws_robomaker_warehouse_ClutteringD_01/4, pose: [6.0, -3.9, 0.0, 0.0]}
  # kolon ekipmanı: koruyucunun arkasında, levhanın altında
  - {uri: Fire Extinguisher/5, pose: [-0.56, 4.40, 0.0, 1.5708]}
  - {uri: Fire Extinguisher/5, pose: [-0.56, -4.15, 0.0, -1.5708]}
